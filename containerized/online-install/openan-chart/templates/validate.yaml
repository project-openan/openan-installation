{{/* Reject combinations that render but cannot serve safely. */}}
{{- $port := include "openan.databasePort" . }}
{{- if or (not (regexMatch "^[0-9]+$" $port)) (lt (int $port) 1) (gt (int $port) 65535) }}{{ fail "SQL port must be an integer in 1..65535" }}{{ end }}
{{- if ne .Values.namespace .Release.Namespace }}{{ fail "namespace must match Helm --namespace" }}{{ end }}
{{- if and .Values.registry.enabled .Values.orchestration.enabled (not .Values.postgresql.enabled) (eq .Values.database.registry.name .Values.database.orchestration.name) }}{{ fail "registry and orchestration require separate external database names" }}{{ end }}
{{- range $name := list "registry" "orchestration" "frontend" }}
{{- $c := index $.Values $name }}
{{- if and $c.enabled (not $c.image.tag) }}{{ fail (printf "%s.image.tag is required; use images built from the accepted service revisions" $name) }}{{ end }}
{{- end }}
{{- if not .Values.database.type }}{{ fail "database.type is required" }}{{ end }}
{{/* Only postgresql is bundled; every other type is an EXTERNAL database.
      The type is passed to the services verbatim (PERSISTENCE_MODE), so any
      backend the services support works without chart changes — but a typo
      or a missing host must die here, not as a runtime CrashLoop. */}}
{{- if and (ne .Values.database.type "postgresql") .Values.postgresql.enabled }}{{ fail (printf "database.type '%s' requires postgresql.enabled=false (only postgresql is bundled)" .Values.database.type) }}{{ end }}
{{- if and (ne .Values.database.type "postgresql") (ne .Values.database.type "mysql") (not .Values.database.host) }}{{ fail (printf "database.type '%s' is external: set database.host" .Values.database.type) }}{{ end }}
{{- if and (eq .Values.database.type "postgresql") (not .Values.postgresql.enabled) (not (or .Values.database.host .Values.postgresql.externalHost)) }}{{ fail "external PostgreSQL requires database.host or postgresql.externalHost" }}{{ end }}
{{- if and .Values.postgresql.enabled (not (or .Values.postgresql.existingSecret .Values.postgresql.password)) }}{{ fail "PostgreSQL requires an explicit password or existingSecret" }}{{ end }}
{{- range $name := list "registry" "orchestration" }}
{{- $c := index $.Values $name }}
{{- if $c.enabled }}
{{- if not $c.runtimeSecret }}{{ fail (printf "%s.runtimeSecret is required; credentials are not generated by the chart" $name) }}{{ end }}
{{- $probeKey := ternary "REGISTRY_HEALTHCHECK_HOST" "ORCH_HEALTHCHECK_HOST" (eq $name "registry") }}
{{- $probeHost := toString (default "127.0.0.1" (index $c.extraEnv $probeKey)) }}
{{- $otherService := ternary "orchestration-center" "registry-center" (eq $name "registry") }}
{{- if or (eq $probeHost $otherService) (hasPrefix (printf "%s." $otherService) $probeHost) (eq $probeHost (include "openan.databaseHost" $)) }}{{ fail (printf "%s probe host must not shadow another service or SQL host" $name) }}{{ end }}
{{- if and (eq $name "orchestration") $c.agentRegistryUrl }}
{{- $registryAuthority := (urlParse $c.agentRegistryUrl).host }}
{{- if eq $probeHost (regexReplaceAll ":[0-9]+$" $registryAuthority "") }}{{ fail "orchestration probe host must not shadow its external registry host" }}{{ end }}
{{- end }}
{{- if $c.tls.enabled }}
{{- if or (ne $c.tls.mode "secret") (not $c.tls.existingSecret) }}{{ fail (printf "%s HTTPS requires tls.mode=secret and tls.existingSecret; use the service certificate tool" $name) }}{{ end }}
{{- else if $c.tls.verifyClient }}{{ fail (printf "%s verifyClient requires HTTPS" $name) }}{{ end }}
{{- if ne $.Values.database.type "postgresql" }}{{- if not (index $.Values.database $name).existingSecret }}{{ fail (printf "database.%s.existingSecret is required for external SQL type '%s'" $name $.Values.database.type) }}{{ end }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.registry.enabled }}
{{- if ne (toString .Values.registry.replicas) "1" }}{{ fail "RC events and dispatchers are process-local: use one replica until distributed coordination exists" }}{{ end }}
{{- if not (has .Values.registry.identityMode (list "token" "certificate")) }}{{ fail "registry.identityMode must be token or certificate" }}{{ end }}
{{- if and (eq .Values.registry.identityMode "certificate") (not (and .Values.registry.tls.enabled .Values.registry.tls.verifyClient)) }}{{ fail "certificate identity requires registry HTTPS and client verification" }}{{ end }}
{{- if and (eq .Values.registry.identityMode "token") (eq .Values.registry.authMode "static_bearer") (not .Values.registry.credentialSecret) }}{{ fail "static_bearer requires registry.credentialSecret with integration_credentials.conf" }}{{ end }}
{{- if not (has .Values.registry.signing.mode (list "auto" "secret" "off")) }}{{ fail "registry.signing.mode must be auto, secret or off" }}{{ end }}
{{- if and (eq .Values.registry.signing.mode "secret") (not .Values.registry.signing.existingSecret) }}{{ fail "signing.mode=secret requires existingSecret" }}{{ end }}
{{- if .Values.registry.vectordb.enabled }}{{ fail "Current RC legacy vector-only mode has no authoritative SQL record store; keep vectordb.enabled=false for full business APIs" }}{{ end }}
{{- end }}
{{- if and .Values.orchestration.enabled (or (ne (toString .Values.orchestration.replicas) "1") .Values.orchestration.hpa.enabled) }}{{ fail "OC sessions are process-local: use one replica and disable HPA until shared sessions exist" }}{{ end }}
{{- $registryClaim := default "registry-center-runtime" .Values.registry.persistence.existingClaim }}
{{- $orchestrationClaim := default "orchestration-center-runtime" .Values.orchestration.persistence.existingClaim }}
{{- if and .Values.registry.enabled .Values.orchestration.enabled (eq $registryClaim $orchestrationClaim) }}{{ fail "registry and orchestration must use separate runtime claims" }}{{ end }}
{{- range $name := list "registry" "orchestration" }}
{{- $c := index $.Values $name }}
{{- if and $c.enabled (not $c.persistence.existingClaim) (not $c.persistence.size) }}{{ fail (printf "%s.persistence.size is required when creating a runtime PVC" $name) }}{{ end }}
{{- if and $c.enabled $c.persistence.createPV }}
{{- if $c.persistence.existingClaim }}{{ fail (printf "%s.persistence.createPV conflicts with existingClaim" $name) }}{{ end }}
{{- if not $c.persistence.storageClassName }}{{ fail (printf "%s.persistence.createPV requires storageClassName matching the claim so the PV and PVC can bind" $name) }}{{ end }}
{{- if and (not $c.persistence.useHostPath) (not $c.persistence.nodeName) }}{{ fail (printf "%s.persistence local PV requires nodeName" $name) }}{{ end }}
{{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.postgresql.storage.createPV (not .Values.postgresql.storage.useHostPath) (not .Values.postgresql.storage.nodeName) }}{{ fail "postgresql.storage local PV requires nodeName" }}{{ end }}
{{- if and .Values.frontend.enabled (not (has (default "portal" .Values.frontend.type) (list "portal" "workflow-designer"))) }}{{ fail "frontend.type must be portal or workflow-designer" }}{{ end }}
{{- if and .Values.frontend.enabled (not .Values.orchestration.enabled) }}{{ fail "frontend requires orchestration.enabled=true" }}{{ end }}
{{- /* Limitation: the portal image cannot verify upstream TLS. With
     frontend.type=portal the OC HTTPS upstream is reached unverified, so the
     backendTls requirement only applies to the nginx-based workflow-designer. */}}
{{- if and .Values.frontend.enabled (eq (include "openan.frontendType" .) "workflow-designer") .Values.orchestration.tls.enabled }}
{{- if and (or .Values.frontend.backendTls.verifyServer .Values.orchestration.tls.verifyClient) (not .Values.frontend.backendTls.existingSecret) }}{{ fail "frontend HTTPS verification/mTLS requires frontend.backendTls.existingSecret" }}{{ end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled (not .Values.ingress.host) }}{{ fail "ingress TLS requires ingress.host matching the certificate" }}{{ end }}
{{- if and .Values.orchestration.enabled .Values.registry.enabled .Values.registry.tls.enabled }}
{{- if and (or .Values.orchestration.clientVerifyServer .Values.registry.tls.verifyClient) (not .Values.orchestration.registryClientSecret) }}{{ fail "OC registry HTTPS verification/mTLS requires orchestration.registryClientSecret" }}{{ end }}
{{- end }}
{{- if not (has (include "openan.publicScheme" .) (list "http" "https")) }}{{ fail "orchestration.publicScheme must be http or https" }}{{ end }}
{{- range $name := list "registry" "orchestration" }}
{{- $c := index $.Values $name }}
{{- if and $c.enabled $.Values.postgresql.enabled }}
{{- $db := index $.Values.database $name }}
{{- if $db.existingSecret }}{{ fail (printf "in-cluster PostgreSQL initializes one shared password; database.%s.existingSecret is for external SQL only, use postgresql.existingSecret" $name) }}{{ end }}
{{- $found := false }}
{{- range $.Values.postgresql.databases }}{{- if and (eq .name $db.name) (eq .user $db.username) }}{{- $found = true }}{{- end }}{{- end }}
{{- if not $found }}{{ fail (printf "database.%s must match a postgresql.databases name/user for in-cluster initialization" $name) }}{{ end }}
{{- end }}
{{- end }}
{{- range $component := list "registry" "orchestration" }}
{{- $c := index $.Values $component }}
{{- if not $c.modelsConfigMap }}
{{- range $cap, $model := $c.llm }}
{{- if and $model.model (not (has (default "openai_compatible" $model.provider) (list "openai_compatible" "openai"))) }}
{{- fail (printf "%s.llm.%s shortcut supports OpenAI-compatible only; use modelsConfigMap for provider/auth extensions" $component $cap) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $value := $c.extraEnv }}
{{- if has $key (list "REGISTRY_IP" "REGISTRY_PORT" "REGISTRY_ENABLE_HTTPS" "REGISTRY_VERIFY_CLIENT" "REGISTRY_OWNER_IDENTITY_MODE" "REGISTRY_INTEGRATION_AUTH_MODE" "REGISTRY_REGISTRY_SIGN_ENABLED" "REGISTRY_USE_VECTORDB" "ORCH_IP" "ORCH_PORT" "ORCH_ENABLE_HTTPS" "ORCH_VERIFY_CLIENT" "ORCH_CLIENT_VERIFY_SERVER" "ORCH_EXTERNAL_AUTH_MODE" "ORCH_PUBLIC_SCHEME" "PERSISTENCE_MODE" "DB_HOST" "DB_PORT" "DB_NAME" "DB_USERNAME" "AGENT_REGISTRY_URL" "LLM_CONFIG_FILE" "REGISTRY_FORWARDED_ALLOW_IPS" "ORCH_FORWARDED_ALLOW_IPS" "REGISTRY_STARTUP_STRICT_IDENTITY" "REGISTRY_REGISTRY_PUBLIC_BASE_URL" "REGISTRY_CA_FILE" "REGISTRY_CLIENT_CERT" "REGISTRY_CLIENT_KEY" "REGISTRY_HEALTHCHECK_CLIENT_CERT" "REGISTRY_HEALTHCHECK_CLIENT_KEY" "ORCH_HEALTHCHECK_CLIENT_CERT" "ORCH_HEALTHCHECK_CLIENT_KEY" "MILVUS_URI") }}
{{- fail (printf "%s.extraEnv duplicates managed setting %s; use its dedicated value" $component $key) }}
{{- end }}
{{- if hasPrefix "A2AT_LLM_" $key }}
{{- fail (printf "%s.extraEnv duplicates managed setting %s; use the orchestration.a2atLlm values (secrets go in runtimeSecret)" $component $key) }}
{{- end }}
{{- end }}
{{- end }}
