# Security response headers (issue #55) for the ingress-nginx entry. Referenced
# from every openan Ingress via the nginx.ingress.kubernetes.io/custom-headers
# annotation; the controller injects these headers on every response. Unlike
# configuration-snippet, custom-headers is honoured by hardened ingress-nginx
# (allow-snippet-annotations=false, default since v1.9).
{{- if and .Values.ingress.enabled .Values.ingress.customHeaders.create (not .Values.ingress.customHeaders.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openan.customHeadersName" . }}
  namespace: {{ include "openan.customHeadersNamespace" . }}
  labels:
    {{- include "openan.labels" . | nindent 4 }}
data:
  {{- with .Values.ingress.customHeaders.contentSecurityPolicy }}
  Content-Security-Policy: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.customHeaders.xFrameOptions }}
  X-Frame-Options: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.customHeaders.xContentTypeOptions }}
  X-Content-Type-Options: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.customHeaders.referrerPolicy }}
  Referrer-Policy: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.customHeaders.permissionsPolicy }}
  Permissions-Policy: {{ . | quote }}
  {{- end }}
{{- end }}
