# =============================================================================
# OpenAN Platform Configuration
# =============================================================================

# Global settings
namespace: openan
# Set to false if namespace already exists or managed externally
createNamespace: true

# =============================================================================
# Database (unified contract — one type flows through every layer, issue #36)
# =============================================================================
#   database.bundled=true  -> the type selects a database.backends entry and
#                            the generic database/statefulset.yaml +
#                            database/storage.yaml templates deploy the
#                            in-cluster StatefulSet from the descriptor
#                            (data, not code).
#   database.bundled=false -> EXTERNAL SQL: no database workload; the type
#                            reaches the services verbatim (PERSISTENCE_MODE
#                            passthrough — the services must support it:
#                            registry-center file/sqlite/postgresql/gauss/
#                            mysql; orchestration-center currently file/
#                            postgresql/mysql).
# Adding a bundled backend = one descriptor entry + one init file
# (database/init/<type>.yaml); the wizard's backend menu follows these keys.
database:
  type: postgresql
  bundled: true
  # External SQL (bundled=false): host + port are required (port defaults
  # come from the backend descriptors when the type has one; unknown types
  # must set it explicitly). Bundled custom port: database.port overrides
  # the descriptor default for both the listener and the services.
  host: ""
  port: null
  # Credential Secret shared by the bundled database bootstrap and both
  # services (key per backend descriptor: postgres-password /
  # mysql-root-password). External SQL instead uses the per-service
  # existingSecret references below. Never a default password: set
  # existingSecret, or password only for pure-Helm evaluation fallback.
  existingSecret: ""
  password: ""
  # Bundled-database storage (operator choices; per-backend pvName/hostPath
  # defaults live in the backend descriptors). createStorageClass also
  # serves registry/orchestration local PVs and applies even when the
  # database is external.
  storage:
    size: 20Gi
    storageClassName: ""
    createStorageClass: false
    createPV: false
    useHostPath: false
    hostPath: ""   # empty -> backend descriptor default
    localPath: ""  # empty -> backend descriptor default
    nodeName: ""
    reclaimPolicy: "Retain"
    setDefault: false
    pvName: ""     # empty -> backend descriptor default
  # Databases created by the bundled init script; the per-service name/user
  # below must match an entry when bundled (validated).
  databases:
    - name: registry_center
      user: registry
    - name: orchestration_center
      user: opena2a_t
  # Per-service SQL identity (also the external SQL credential contract).
  registry:
    name: registry_center
    username: registry
    existingSecret: ""   # external SQL only (rejected when bundled)
    passwordKey: db-password
  orchestration:
    name: orchestration_center
    username: opena2a_t
    existingSecret: ""   # external SQL only (rejected when bundled)
    passwordKey: db-password
  # In-cluster backend descriptors — DATA, not templates. The generic
  # workload/storage templates render any entry; only the init ConfigMap
  # (database/init/<type>.yaml) is per-backend (bootstrap SQL dialect).
  # "{port}" inside args/probe commands is substituted with the backend
  # port; credentialSecretSuffix names the wizard's credential Secret
  # (<release>-<suffix>; historical names stay stable).
  backends:
    postgresql:
      name: postgres                  # workload suffix: openan-postgres
      image: "postgres:15-alpine"
      port: 5432
      passwordEnv: POSTGRES_PASSWORD
      passwordKey: postgres-password
      credentialSecretSuffix: pg
      env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      args: ["-p", "{port}"]
      readinessProbe:
        command: [pg_isready, -U, postgres, -p, "{port}"]
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        command: [pg_isready, -U, postgres, -p, "{port}"]
        initialDelaySeconds: 15
        periodSeconds: 30
      dataVolume:
        name: postgres-data
        mountPath: /var/lib/postgresql/data
      initMountPath: /docker-entrypoint-initdb.d
      pvName: openan-postgres-pv
      hostPath: /data/openan-postgres
      localPath: /data/openan-postgres
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    mysql:
      name: mysql
      image: "mysql:8.4.3"
      port: 3306
      passwordEnv: MYSQL_ROOT_PASSWORD
      passwordKey: mysql-root-password
      credentialSecretSuffix: mysql
      env: []
      args: []
      readinessProbe:
        command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"']
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"']
        initialDelaySeconds: 30
        periodSeconds: 30
      dataVolume:
        name: mysql-data
        mountPath: /var/lib/mysql
      initMountPath: /docker-entrypoint-initdb.d
      pvName: openan-mysql-pv
      hostPath: /data/openan-mysql
      localPath: /data/openan-mysql
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

# =============================================================================
# Registry Center Configuration (Required)
# =============================================================================
registry:
  ingressClientSecret: ""  # tls.crt/tls.key/ca.crt for ingress upstream mTLS
  runtimeSecret: ""  # Secret ENV: fingerprint/HMAC or OAuth2 credentials
  credentialSecret: ""  # integration_credentials.conf (static Bearer/mTLS entries)
  identityMode: token  # certificate requires TLS + verifyClient=true
  authMode: static_bearer
  publicBaseUrl: ""
  extraEnv: {}  # Non-secret REGISTRY_* provider policies; secrets belong in runtimeSecret
  modelsConfigMap: ""  # Existing ConfigMap with models.yaml; otherwise llm entries below
  enabled: true
  # Runtime event listeners/dispatchers are not coordinated across replicas.
  replicas: 1
  persistence:
    existingClaim: ""  # Otherwise create registry-center-runtime (retained on uninstall).
    size: 5Gi
    storageClassName: ""  # Empty: default StorageClass; "-": explicitly no class.
    # Evaluation fallback for clusters without a StorageClass: create a
    # node-pinned local PV matching the claim (see QUICKSTART "Storage").
    createPV: false
    useHostPath: true
    hostPath: "/data/openan-registry"
    nodeName: ""
    pvName: "openan-rc-pv"
    reclaimPolicy: "Retain"
  image:
    repository: ghcr.io/project-openan/registry-center
    tag: ""  # REQUIRED: tag/digest-built revision compatible with this chart; see deployment contract.
    pullPolicy: Always
  port: 5000
  # LLM configuration for registry-center
  llm:
    chat:
      model: "your-chat-model"
      url: "https://your-llm-provider.com/v1/chat/completions"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "registry-llm-chat-api-key"
    embed:
      model: "your-embed-model"
      url: "https://your-llm-provider.com/v1/embeddings"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "registry-llm-embed-api-key"
    rerank:
      model: "your-rerank-model"
      url: "https://your-llm-provider.com/v1/rerank"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "registry-llm-rerank-api-key"
  # VectorDB (optional, Milvus)
  vectordb:
    enabled: false
    host: ""
    port: 19530
  # TLS material is supplied explicitly; no empty-password Helm TLS generation.
  tls:
    enabled: false
    verifyClient: false
    mode: secret
    existingSecret: ""  # server.cer, server_key.pem, cert_pwd, trust.cer; see deployment guide
  # Signing is independent of TLS. Auto is for demos; secret is recommended.
  signing:
    mode: auto
    existingSecret: ""  # sign.cer, sign_key.pem, cert_pwd
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Probes
  livenessProbe:
    exec:
      command: ["python", "-m", "agent_registry.healthcheck"]
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    exec:
      command: ["python", "-m", "agent_registry.healthcheck"]
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10

# =============================================================================
# Orchestration Center Configuration (Optional)
# =============================================================================
orchestration:
  # Vector retrieval policy — requires an OC image with RETRIEVAL_* deployment
  # alias support (orchestration-center #179 or later); older images silently
  # ignore these keys and the feature stays off.
  retrieval:
    vector:
      enabled: false
      topK: 5
      minScore: 0
      rerank: false
      llmFinal: true
      strict: false
      indexFile: data/vector_index/psop_vectors.json
    llm:
      thinking: true
  ingressClientSecret: ""
  runtimeSecret: ""  # ENV: OC_ADMIN_INITIAL_PASSWORD, REGISTRY_ACCESS_TOKEN, model secrets
  extraEnv: {}  # Non-secret ORCH_* settings
  publicScheme: ""  # Derived from ingress TLS unless explicitly http/https
  clientVerifyServer: true
  registryClientSecret: ""  # Optional trust.cer, client.cer, client_key.pem
  modelsConfigMap: ""
  tls:
    enabled: false
    verifyClient: false
    mode: secret
    existingSecret: ""
  # Set to false to skip orchestration-center deployment
  enabled: true
  replicas: 1
  persistence:
    existingClaim: ""  # Otherwise create orchestration-center-runtime (retained).
    size: 10Gi
    storageClassName: ""
    # Evaluation fallback for clusters without a StorageClass: create a
    # node-pinned local PV matching the claim (see QUICKSTART "Storage").
    createPV: false
    useHostPath: true
    hostPath: "/data/openan-orchestration"
    nodeName: ""
    pvName: "openan-oc-pv"
    reclaimPolicy: "Retain"
  image:
    repository: ghcr.io/project-openan/orchestration-center
    tag: ""  # REQUIRED: tag/digest-built revision compatible with this chart; see deployment contract.
    pullPolicy: Always
  port: 5001
  # Registry Center URL (auto-discovered if registry.enabled=true)
  agentRegistryUrl: ""
  # LLM configuration for orchestration-center (embed drives workflow
  # semantic retrieval; rerank is optional for top-N retrieval).
  llm:
    chat:
      model: "your-chat-model"
      url: "https://your-llm-provider.com/v1/chat/completions"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "orchestration-llm-chat-api-key"
    embed:
      model: ""
      url: ""
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "orchestration-llm-embed-api-key"
      keyless: false
    rerank:
      model: ""
      url: ""
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "orchestration-llm-rerank-api-key"
      keyless: false
  # A2A-T SDK LLM used by workflow negotiation/execution — independent of
  # llm.chat. The API key belongs in runtimeSecret as A2AT_LLM_API_KEY.
  a2atLlm:
    provider: ""  # keep "openai": other names are backend-only registrations
    model: ""
    baseUrl: ""
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # HPA
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # Probes
  livenessProbe:
    exec:
      command: ["python", "-m", "orchestrate.server.healthcheck"]
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    exec:
      command: ["python", "-m", "orchestrate.server.healthcheck"]
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
  startupProbe:
    exec:
      command: ["python", "-m", "orchestrate.server.healthcheck"]
    failureThreshold: 12
    periodSeconds: 10
    # The exec healthcheck takes ~1.3-1.4s; the K8s default of 1s never
    # succeeds, so the timeout must be explicit (same as liveness/readiness).
    timeoutSeconds: 10

# =============================================================================
# Frontend Configuration (unified entry: portal or workflow-designer)
# =============================================================================
frontend:
  # Which frontend serves the unified entry:
  #   portal            - openan-portal (default; container listens on 8080,
  #                       proxies /api/orchestrate and /api/registry itself)
  #   workflow-designer - legacy frontend (container listens on 80, chart
  #                       manages its nginx config)
  type: portal  # portal | workflow-designer
  backendTls:
    verifyServer: true
    existingSecret: ""  # trust.cer; client.cer/client_key.pem when OC requires mTLS
  # Set to false to skip the frontend deployment
  enabled: true
  replicas: 2
  image:
    # Empty repository -> derived from frontend.type
    # (ghcr.io/project-openan/openan-portal or .../workflow-designer)
    repository: ""
    tag: ""  # REQUIRED: tag/digest-built revision compatible with this chart; see deployment contract.
    pullPolicy: Always
  # External Service port (stable); the container port switches by type.
  port: 80
  nodePort: 30191
  # Nginx configuration for workflow-designer only (frontend.type=workflow-designer).
  # Empty uses the protocol-aware managed template. Advanced overrides are Helm templates.
  nginxConfig: ""
  # Optional node affinity (e.g. to pin the frontend away from a node with
  # known DNS or network issues). Passed through to the Pod spec as-is.
  nodeAffinity: {}
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # HPA
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # Probes
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# =============================================================================
# Ingress Configuration
# =============================================================================
ingress:
  backendVerifyServer: true  # HTTPS upstream requires per-service ingressClientSecret (ca.crt)
  enabled: true
  className: nginx
  # host: Set to a DNS name for host-based routing, or leave empty for IP-based path routing
  # Examples: "openan.local" for DNS, "" for direct IP access (e.g., http://<LB_IP>/)
  host: ""
  # TLS configuration
  tls:
    enabled: false
    secretName: openan-tls
  # Annotations
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
