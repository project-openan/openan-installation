{{/* Per-backend init script (the only backend-specific template: the SQL
     dialect of the bootstrap). Adding a bundled backend adds one file here
     named after its database.backends key. */}}
{{- $type := include "openan.dbType" . }}
{{- $backend := index .Values.database.backends $type }}
{{- if and (eq $type "mysql") $backend }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openan-{{ $backend.name }}-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.db.labels" . | nindent 4 }}
data:
  create-databases.sh: |
    #!/bin/bash
    set -e
    {{ range .Values.database.databases }}
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<EOSQL
    CREATE DATABASE IF NOT EXISTS {{ .name }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS '{{ .user }}'@'%' IDENTIFIED BY '${MYSQL_ROOT_PASSWORD}';
    GRANT ALL PRIVILEGES ON {{ .name }}.* TO '{{ .user }}'@'%';
    EOSQL
    {{ end }}
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "FLUSH PRIVILEGES;"
{{- end }}
