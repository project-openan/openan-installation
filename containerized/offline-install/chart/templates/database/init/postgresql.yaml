{{/* Per-backend init script (the only backend-specific template: the SQL
     dialect of the bootstrap). Adding a bundled backend adds one file here
     named after its database.backends key. */}}
{{- $type := include "openan.dbType" . }}
{{- $backend := index .Values.database.backends $type }}
{{- if and (eq $type "postgresql") $backend }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openan-{{ $backend.name }}-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.db.labels" . | nindent 4 }}
data:
  create-databases.sh: |
    #!/bin/bash
    set -e
    {{ range .Values.database.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<EOSQL
    CREATE USER {{ .user }} WITH PASSWORD '${POSTGRES_PASSWORD}';
    CREATE DATABASE {{ .name }} OWNER {{ .user }};
    GRANT ALL PRIVILEGES ON DATABASE {{ .name }} TO {{ .user }};
    EOSQL
    {{ end }}
{{- end }}
