{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openan-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "openan.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openan.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if eq (include "openan.frontendType" .) "workflow-designer" }}
      initContainers:
        # The stock nginx entrypoint renders /etc/nginx/templates/*.template
        # into /etc/nginx/conf.d/, which fails when a ConfigMap is mounted
        # there read-only. Render into an emptyDir instead and hand that to
        # nginx; fall back to the chart's own config when the image ships no
        # template directory.
        - name: render-nginx-config
          image: "{{ include "openan.frontendImageRepository" . }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: BACKEND_SCHEME
              value: {{ include "openan.httpScheme" . | quote }}
            - name: BACKEND_HOST
              value: "orchestration-center"
            - name: BACKEND_PORT
              value: "5001"
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            - name: BACKEND_TLS_OPTIONS
              value: >-
                proxy_ssl_server_name on;
                proxy_ssl_name orchestration-center;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/nginx/backend-tls/trust.cer;
                {{- if and .Values.https.verifyClient (or (eq (include "openan.frontendType" .) "workflow-designer") true) }}
                proxy_ssl_certificate /etc/nginx/backend-tls/client.cer;
                proxy_ssl_certificate_key /etc/nginx/backend-tls/client_key.pem;
                {{- end }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /etc/nginx/templates/default.conf.template ]; then
                SRC=/etc/nginx/templates/default.conf.template
              elif [ -f /cm/default.conf ]; then
                cp /cm/default.conf /rendered/default.conf
                echo "using ConfigMap-provided default.conf"
                exit 0
              else
                echo "no nginx template or configmap found" >&2; exit 1
              fi
              if command -v envsubst >/dev/null 2>&1; then
                envsubst '${BACKEND_SCHEME} ${BACKEND_HOST} ${BACKEND_PORT} ${BACKEND_TLS_OPTIONS}' < "$SRC" > /rendered/default.conf
              else
                sed -e "s|\${BACKEND_SCHEME}|${BACKEND_SCHEME}|g" \
                    -e "s|\${BACKEND_HOST}|${BACKEND_HOST}|g" \
                    -e "s|\${BACKEND_PORT}|${BACKEND_PORT}|g" \
                    -e "s|\${BACKEND_TLS_OPTIONS}|${BACKEND_TLS_OPTIONS}|g" \
                    "$SRC" > /rendered/default.conf
              fi
              echo "rendered default.conf:"
              grep -n 'proxy_pass\|proxy_ssl' /rendered/default.conf || true
          volumeMounts:
            - name: nginx-conf-rendered
              mountPath: /rendered
            - name: nginx-config-cm
              mountPath: /cm
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            - name: backend-tls
              mountPath: /etc/nginx/backend-tls
              readOnly: true
            {{- end }}
      {{- end }}
      {{- if eq (include "openan.frontendType" .) "portal" }}
      initContainers:
        # The portal JS hardcodes http://127.0.0.1:5001 (and :5000) as backend
        # defaults (read from localStorage server_config); the BACKEND_URL env
        # var only configures the nginx proxy, not the JS. The portal nginx
        # already proxies /rest/v1/orchestrate/ and /api/* to the backends,
        # so the fix is to strip the hardcoded absolute URL from the JS,
        # making all API calls relative (same-origin) and routed through
        # the portal's own nginx proxy.
        - name: patch-portal-defaults
          image: "{{ include "openan.frontendImageRepository" . }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp -r /usr/share/nginx/html/. /patched/
              # Strip hardcoded absolute backend URLs; the portal nginx
              # (configured via BACKEND_URL/REGISTRY_URL env vars) proxies
              # /rest/v1/orchestrate/ and /api/* to the actual services.
              find /patched -name '*.js' -exec sed -i \
                -e 's|https\?://127\.0\.0\.1:5001||g' \
                -e 's|https\?://127\.0\.0\.1:5000||g' \
                {} +
              echo "portal JS backend defaults stripped to relative URLs (nginx proxy)"
          volumeMounts:
            - name: portal-html
              mountPath: /patched
      {{- end }}
      containers:
        - name: openan-frontend
          image: "{{ include "openan.frontendImageRepository" . }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- if eq (include "openan.frontendType" .) "portal" }}
          # The portal image renders its nginx config itself (envsubst template
          # shipped in the image); the chart only provides the upstream URLs
          # and the backend TLS material paths (mounted via backendTlsSecret).
          env:
            - name: BACKEND_URL
              value: {{ include "openan.httpScheme" . }}://orchestration-center:{{ .Values.orchestration.port }}
            - name: REGISTRY_URL
              value: {{ include "openan.httpScheme" . }}://registry-center:{{ .Values.registry.port }}
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            - name: BACKEND_VERIFY_SERVER
              value: "true"
            - name: REGISTRY_VERIFY_SERVER
              value: "true"
            - name: BACKEND_CA_FILE
              value: /etc/nginx/backend-tls/trust.cer
            - name: REGISTRY_CA_FILE
              value: /etc/nginx/backend-tls/trust.cer
            {{- if .Values.https.verifyClient }}
            - name: BACKEND_CLIENT_CERT
              value: /etc/nginx/backend-tls/client.cer
            - name: BACKEND_CLIENT_KEY
              value: /etc/nginx/backend-tls/client_key.pem
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ include "openan.frontendContainerPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ dig "path" "/" .Values.frontend.livenessProbe.httpGet }}
              port: {{ include "openan.frontendContainerPort" . }}
            {{- toYaml (omit .Values.frontend.livenessProbe "httpGet") | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ dig "path" "/" .Values.frontend.readinessProbe.httpGet }}
              port: {{ include "openan.frontendContainerPort" . }}
            {{- toYaml (omit .Values.frontend.readinessProbe "httpGet") | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if eq (include "openan.frontendType" .) "workflow-designer" }}
          volumeMounts:
            - name: nginx-conf-rendered
              mountPath: /etc/nginx/conf.d
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            - name: backend-tls
              mountPath: /etc/nginx/backend-tls
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if eq (include "openan.frontendType" .) "portal" }}
          volumeMounts:
            - name: portal-html
              mountPath: /usr/share/nginx/html
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            - name: backend-tls
              mountPath: /etc/nginx/backend-tls
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if eq (include "openan.frontendType" .) "workflow-designer" }}
      volumes:
        - name: nginx-conf-rendered
          emptyDir: {}
        - name: nginx-config-cm
          configMap:
            name: openan-frontend-nginx-config
        {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
        - name: backend-tls
          secret:
            secretName: {{ .Values.frontend.backendTlsSecret }}
            defaultMode: 0440
            # The ingress client material is stored as tls.crt/tls.key/ca.crt;
            # the frontend nginx contract expects client.cer/client_key.pem/trust.cer
            items:
            - key: ca.crt
              path: trust.cer
            - key: tls.crt
              path: client.cer
            - key: tls.key
              path: client_key.pem
        {{- end }}
      {{- end }}
      {{- if eq (include "openan.frontendType" .) "portal" }}
      volumes:
        - name: portal-html
          emptyDir: {}
        {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
        - name: backend-tls
          secret:
            secretName: {{ .Values.frontend.backendTlsSecret }}
            defaultMode: 0440
            # The ingress client material is stored as tls.crt/tls.key/ca.crt;
            # the frontend nginx contract expects client.cer/client_key.pem/trust.cer
            items:
            - key: ca.crt
              path: trust.cer
            - key: tls.crt
              path: client.cer
            - key: tls.key
              path: client_key.pem
        {{- end }}
      {{- end }}
{{- end }}
