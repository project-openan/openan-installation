{{- if .Values.orchestration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: orchestration-center-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  db-password: {{ .Values.database.password | quote }}
  {{- end }}
  {{- range $cap, $model := .Values.orchestration.llm }}
  {{- if and $model.model $model.apiKey (not $model.existingSecret) }}
  llm-{{ $cap }}-api-key: {{ $model.apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.orchestration.llm.embed.apiKey }}
  llm-embed-api-key: {{ .Values.orchestration.llm.embed.apiKey | quote }}
  {{- end }}
  {{- if .Values.orchestration.llm.rerank.apiKey }}
  llm-rerank-api-key: {{ .Values.orchestration.llm.rerank.apiKey | quote }}
  {{- end }}
{{- end }}
