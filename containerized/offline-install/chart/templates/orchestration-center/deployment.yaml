{{- if .Values.orchestration.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-center
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestration.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openan.orchestration.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openan.orchestration.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "openan.orchestration.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: prepare-runtime
          image: "{{ .Values.orchestration.image.repository }}:{{ .Values.orchestration.image.tag }}"
          # Runs as root: the hostPath PVC volume root is owned by root with
          # mode 0755 (group has no write), so the app user (10001) cannot
          # create directories. Root creates and chowns them to 10001.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /runtime/data /runtime/log
              chmod 0770 /runtime/data /runtime/log
              chown 10001:10001 /runtime/data /runtime/log
              # Make the volume root group-writable for the app user
              chgrp 10001 /runtime
              chmod 1770 /runtime
              echo "runtime directories prepared (10001:10001, mode 0770)"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: runtime
              mountPath: /runtime
        # The image ships only etc/conf/db_config.json.template while the
        # entrypoint edits etc/conf/db_config.json in place. Copy the whole
        # etc tree onto a writable emptyDir so the entrypoint can write.
        - name: seed-etc
          image: "{{ .Values.orchestration.image.repository }}:{{ .Values.orchestration.image.tag }}"
          imagePullPolicy: {{ .Values.orchestration.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp -r --no-preserve=timestamps,ownership /opt/orchestration-center/etc/. /seeded/ 2>/dev/null || \
                cp -r /opt/orchestration-center/etc/. /seeded/
              if [ ! -f /seeded/conf/db_config.json ] && [ -f /seeded/conf/db_config.json.template ]; then
                cp /seeded/conf/db_config.json.template /seeded/conf/db_config.json
              fi
              ls -la /seeded/conf/
          volumeMounts:
            - name: etc-dir
              mountPath: /seeded
      containers:
      - name: orchestration-center
        image: "{{ .Values.orchestration.image.repository }}:{{ .Values.orchestration.image.tag }}"
        imagePullPolicy: {{ .Values.orchestration.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.orchestration.port }}
        envFrom:
        - configMapRef:
            name: orchestration-center-config
        {{- if .Values.orchestration.runtimeSecret }}
        - secretRef:
            name: {{ .Values.orchestration.runtimeSecret }}
        {{- end }}
        env:
        - name: DB_PASSWORD
          {{- if .Values.database.existingSecret }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.existingSecret }}
              key: {{ include "openan.dbPasswordKey" . }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: db-password
          {{- end }}
        {{- if or .Values.orchestration.admin.existingSecret .Values.orchestration.admin.initialPassword }}
        - name: OC_ADMIN_INITIAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.admin.existingSecret | default "orchestration-center-admin" }}
              key: admin-password
        {{- end }}
        - name: LLM_CONFIG_FILE
          value: /opt/orchestration-center/etc/config/models.yaml
        {{- range $cap, $model := .Values.orchestration.llm }}
        {{- if and $model.model (not $model.keyless) (or $model.apiKey $model.existingSecret) }}
        - name: LLM_{{ upper $cap }}_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ default "orchestration-center-secret" $model.existingSecret }}
              key: {{ ternary $model.existingSecretKey (printf "llm-%s-api-key" $cap) (not (empty $model.existingSecret)) }}
        {{- end }}
        {{- end }}
        {{- if .Values.orchestration.llm.embed.apiKey }}
        - name: LLM_EMBED_API_KEY
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: llm-embed-api-key
        {{- else if .Values.orchestration.llm.embed.existingSecret }}
        - name: LLM_EMBED_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.llm.embed.existingSecret }}
              key: {{ .Values.orchestration.llm.embed.existingSecretKey }}
        {{- end }}
        {{- if .Values.orchestration.llm.rerank.apiKey }}
        - name: LLM_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: llm-rerank-api-key
        {{- else if .Values.orchestration.llm.rerank.existingSecret }}
        - name: LLM_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.llm.rerank.existingSecret }}
              key: {{ .Values.orchestration.llm.rerank.existingSecretKey }}
        {{- end }}
        startupProbe:
          {{- toYaml .Values.orchestration.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.orchestration.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.orchestration.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.orchestration.resources | nindent 10 }}
        volumeMounts:
        - name: runtime
          mountPath: /opt/orchestration-center/data
          subPath: data
        - name: runtime
          mountPath: /opt/orchestration-center/log
          subPath: log
        - name: etc-dir
          mountPath: /opt/orchestration-center/etc
        - name: models-config
          mountPath: /opt/orchestration-center/etc/config/models.yaml
          subPath: models.yaml
          readOnly: true
        {{- if and .Values.https.enabled (ne .Values.orchestration.tls.mode "off") }}
        {{- /* Per-file subPath mounts keep the seeded etc/ssl directory (0700,
             from the image via seed-etc). A whole-directory secret mount
             replaces it with a kubelet-created 0755 root, which the
             service's TLS permission check rejects. */}}
        {{- range $key := list "server.cer" "server_key.pem" "cert_pwd" "trust.cer" }}
        - name: tls-certs
          mountPath: /opt/orchestration-center/etc/ssl/{{ $key }}
          subPath: {{ $key }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if and .Values.https.enabled .Values.orchestration.registryClientSecret }}
        - name: registry-tls
          mountPath: /opt/orchestration-center/etc/registry_tls/trust.cer
          subPath: trust.cer
          readOnly: true
        {{- if .Values.https.verifyClient }}
        - name: registry-tls
          mountPath: /opt/orchestration-center/etc/registry_tls/client.cer
          subPath: client.cer
          readOnly: true
        - name: registry-tls
          mountPath: /opt/orchestration-center/etc/registry_tls/client_key.pem
          subPath: client_key.pem
          readOnly: true
        {{- end }}
        {{- end }}
      volumes:
      - name: runtime
        persistentVolumeClaim:
          claimName: {{ default "orchestration-center-runtime" .Values.orchestration.persistence.existingClaim }}
      - name: etc-dir
        emptyDir: {}
      - name: models-config
        configMap:
          name: {{ default "orchestration-center-models" .Values.orchestration.modelsConfigMap }}
      {{- if and .Values.https.enabled (ne .Values.orchestration.tls.mode "off") }}
      - name: tls-certs
        secret:
          {{- if eq .Values.orchestration.tls.mode "auto" }}
          secretName: orchestration-center-tls
          {{- else }}
          secretName: {{ .Values.orchestration.tls.existingSecret }}
          {{- end }}
          # 0444 (the K8s default) leaves the private key world-readable;
          # the service refuses to start on such TLS mounts.
          defaultMode: 0440
      {{- end }}
      {{- if and .Values.https.enabled .Values.orchestration.registryClientSecret }}
      - name: registry-tls
        secret:
          secretName: {{ .Values.orchestration.registryClientSecret }}
          defaultMode: 0440
      {{- end }}
{{- end }}
