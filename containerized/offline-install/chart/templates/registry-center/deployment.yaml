{{- if .Values.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-center
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.registry.replicas }}
  selector:
    matchLabels:
      {{- include "openan.registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openan.registry.selectorLabels" . | nindent 8 }}
    spec:
      # fsGroup lets kubelet chown secret volumes to group 10001, so the
      # defaultMode 0440 mounts (TLS/signing) are group-readable by the
      # non-root application user; without it the volumes stay root:root
      # and the service cannot read its own keys (field crash).
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "openan.registry.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      containers:
      - name: registry-center
        image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
        imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.registry.port }}
        envFrom:
        - configMapRef:
            name: registry-center-config
        env:
        - name: DB_PASSWORD
          {{- if .Values.database.existingSecret }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.existingSecret }}
              key: {{ include "openan.dbPasswordKey" . }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: registry-center-secret
              key: db-password
          {{- end }}
        {{- if .Values.registry.llm.chat.apiKey }}
        - name: LLM_CHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: registry-center-secret
              key: llm-chat-api-key
        {{- else if .Values.registry.llm.chat.existingSecret }}
        - name: LLM_CHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.registry.llm.chat.existingSecret }}
              key: {{ .Values.registry.llm.chat.existingSecretKey }}
        {{- end }}
        {{- if .Values.registry.llm.embed.apiKey }}
        - name: LLM_EMBED_API_KEY
          valueFrom:
            secretKeyRef:
              name: registry-center-secret
              key: llm-embed-api-key
        {{- else if .Values.registry.llm.embed.existingSecret }}
        - name: LLM_EMBED_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.registry.llm.embed.existingSecret }}
              key: {{ .Values.registry.llm.embed.existingSecretKey }}
        {{- end }}
        {{- if .Values.registry.llm.rerank.apiKey }}
        - name: LLM_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: registry-center-secret
              key: llm-rerank-api-key
        {{- else if .Values.registry.llm.rerank.existingSecret }}
        - name: LLM_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.registry.llm.rerank.existingSecret }}
              key: {{ .Values.registry.llm.rerank.existingSecretKey }}
        {{- end }}
        livenessProbe:
          httpGet:
            scheme: {{ ternary "HTTPS" "HTTP" .Values.https.enabled }}
            {{- toYaml (omit .Values.registry.livenessProbe.httpGet "scheme") | nindent 12 }}
          {{- toYaml (omit .Values.registry.livenessProbe "httpGet") | nindent 10 }}
        readinessProbe:
          httpGet:
            scheme: {{ ternary "HTTPS" "HTTP" .Values.https.enabled }}
            {{- toYaml (omit .Values.registry.readinessProbe.httpGet "scheme") | nindent 12 }}
          {{- toYaml (omit .Values.registry.readinessProbe "httpGet") | nindent 10 }}
        resources:
          {{- toYaml .Values.registry.resources | nindent 10 }}
        volumeMounts:
        - name: models-config
          mountPath: /opt/registry-center/etc/config/models.yaml
          subPath: models.yaml
          readOnly: true
        {{- if ne .Values.registry.tls.mode "off" }}
        {{- /* Per-file subPath mounts keep the image's etc/ssl directory (0700,
             owned by UID 10001). A whole-directory secret mount replaces it
             with a kubelet-created 0755 root, which the service's TLS
             permission check rejects (field crash). */}}
        {{- range $key := list "server.cer" "server_key.pem" "cert_pwd" "trust.cer" }}
        - name: tls-certs
          mountPath: /opt/registry-center/etc/ssl/{{ $key }}
          subPath: {{ $key }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if ne .Values.registry.signing.mode "off" }}
        {{- range $key := list "sign.cer" "sign_key.pem" "cert_pwd" }}
        - name: signing-certs
          mountPath: /opt/registry-center/etc/sign_cert/{{ $key }}
          subPath: {{ $key }}
          readOnly: true
        {{- end }}
        {{- end }}
      volumes:
      - name: models-config
        configMap:
          name: registry-center-models
      {{- if ne .Values.registry.tls.mode "off" }}
      - name: tls-certs
        secret:
          {{- if eq .Values.registry.tls.mode "auto" }}
          secretName: registry-center-tls
          {{- else }}
          secretName: {{ .Values.registry.tls.existingSecret }}
          {{- end }}
          # 0444 (the K8s default) leaves the private key world-readable;
          # the service refuses to start on such TLS mounts.
          defaultMode: 0440
      {{- end }}
      {{- if ne .Values.registry.signing.mode "off" }}
      - name: signing-certs
        secret:
          {{- if eq .Values.registry.signing.mode "auto" }}
          secretName: registry-center-signing
          {{- else }}
          secretName: {{ .Values.registry.signing.existingSecret }}
          {{- end }}
          defaultMode: 0440
      {{- end }}
{{- end }}
