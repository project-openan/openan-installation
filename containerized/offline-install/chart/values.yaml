# =============================================================================
# OpenAN Platform Configuration
# =============================================================================

# Global settings
namespace: openan
# Set to false if namespace already exists or managed externally
createNamespace: true

# =============================================================================
# Database selection
# =============================================================================
# Which database backend the platform uses: postgresql or mysql.
database:
  type: postgresql

# =============================================================================
# PostgreSQL Configuration (Shared)
# =============================================================================
postgresql:
  # Set to false to use external database
  enabled: true
  # External database settings (when enabled=false)
  externalHost: ""
  port: 5432
  # Database credentials
  # Use existingSecret to reference an existing K8S secret instead of defining password here
  existingSecret: ""
  password: "openan-db-password"
  # Image (offline: rewritten to <registry>/library/postgres:15-alpine)
  image: "postgres:15-alpine"
  # Storage
  storage:
    size: 20Gi
    storageClassName: ""
    createStorageClass: false
    createPV: false
    useHostPath: false
    hostPath: "/data/openan-postgres"
    localPath: "/data/openan-postgres"
    nodeName: ""
    reclaimPolicy: "Retain"
    setDefault: false
    pvName: "openan-postgres-pv"
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Database definitions
  databases:
    - name: registry_center
      user: registry
    - name: orchestration_center
      user: opena2a_t

# =============================================================================
# MySQL Configuration (used when database.type=mysql)
# =============================================================================
mysql:
  # Enabled by the installer when database.type=mysql. When enabled=false an
  # external MySQL (externalHost) is used.
  enabled: false
  externalHost: ""
  port: 3306
  # Root password of the bundled MySQL instance
  # Use existingSecret to reference an existing K8S secret instead of defining password here
  existingSecret: ""
  password: "openan-db-password"
  # Image (offline: rewritten to <registry>/library/mysql:8.4.3)
  image: "mysql:8.4.3"
  # Storage
  storage:
    size: 20Gi
    storageClassName: ""
    createStorageClass: false
    createPV: false
    useHostPath: false
    hostPath: "/data/openan-mysql"
    localPath: "/data/openan-mysql"
    nodeName: ""
    reclaimPolicy: "Retain"
    setDefault: false
    pvName: "openan-mysql-pv"
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Database definitions (created by the init script on first boot)
  databases:
    - name: registry_center
      user: registry
    - name: orchestration_center
      user: opena2a_t

# =============================================================================
# Transport security
# =============================================================================
# Serve registry-center and orchestration-center over HTTPS inside the
# cluster. The offline installer enables this by default and provisions
# certificates (tool/gen_certs.py or operator-provided Secrets).
# verifyClient additionally requires client certificates (mTLS) on the
# registry listener; keep false when clients authenticate by other means
# (kubelet httpGet probes present no client certificate).
https:
  enabled: false
  verifyClient: false

# =============================================================================
# Registry Center Configuration (Required)
# =============================================================================
registry:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/project-openan/registry-center
    tag: v1.0.0
    pullPolicy: IfNotPresent
  port: 5000
  # Validate JWS signatures on AgentCards (server.conf signature_validation_enabled).
  # Offline installs serve plain HTTP; keep false unless agents sign their cards.
  signatureValidationEnabled: false
  # LLM configuration for registry-center
  llm:
    chat:
      model: "your-chat-model"
      url: "https://your-llm-provider.com/v1/chat/completions"
      apiKey: "your-api-key"
      existingSecret: ""
      existingSecretKey: "registry-llm-chat-api-key"
    embed:
      model: "your-embed-model"
      url: "https://your-llm-provider.com/v1/embeddings"
      apiKey: "your-api-key"
      existingSecret: ""
      existingSecretKey: "registry-llm-embed-api-key"
    rerank:
      model: "your-rerank-model"
      url: "https://your-llm-provider.com/v1/rerank"
      apiKey: "your-api-key"
      existingSecret: ""
      existingSecretKey: "registry-llm-rerank-api-key"
  # VectorDB (optional, Milvus)
  vectordb:
    enabled: false
    host: ""
    port: 19530
  # TLS certificate configuration
  # mode: auto (Helm generates self-signed cert, stored in Secret) / secret (user-provided Secret) / off (no certs mounted)
  # "auto" is recommended: generates once, persists in Secret, consistent across replicas and upgrades.
  tls:
    mode: auto
    existingSecret: ""  # Used when mode=secret. Secret containing server.cer, server_key.pem, trust.cer, cert_pwd
  # Ingress upstream client material for backend certificate verification /
  # mTLS: Secret with tls.crt, tls.key, ca.crt (required when
  # ingress.backendVerifyServer=true or https.verifyClient=true).
  ingressClientSecret: ""
  # JWS signing certificate configuration
  # mode: auto (Helm generates self-signed cert, stored in Secret) / secret (user-provided Secret) / off (no certs mounted)
  # "auto" is recommended: generates once, persists in Secret, consistent across replicas and upgrades.
  # NOTE: the entrypoint does NOT generate signing material — with mode=off you
  # must mount etc/sign_cert/{sign.cer,sign_key.pem,cert_pwd} yourself.
  signing:
    mode: auto
    existingSecret: ""  # Used when mode=secret. Secret containing sign.cer, sign_key.pem, cert_pwd
                        # (generate with: python -m generate_selfsign_cert ./sign_cert dataSigning)
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Probes
  livenessProbe:
    httpGet:
      path: /rest/v1/registry-center/agent-cards
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /rest/v1/registry-center/agent-cards
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 10

# =============================================================================
# Orchestration Center Configuration (Optional)
# =============================================================================
orchestration:
  modelsConfigMap: ""  # Existing complete models.yaml; bypass the shortcuts below.
  runtimeSecret: ""  # Optional model-provider credentials for an external model file.
  persistence:
    existingClaim: ""
    size: 10Gi
    storageClassName: ""
    # Local-PV fallback for clusters without a StorageClass (mirrors the
    # database storage blocks; the installer enables it via STORAGE_MODE).
    createPV: false
    useHostPath: true
    hostPath: "/data/openan-orchestration-runtime"
    nodeName: ""
    pvName: "openan-oc-runtime-pv"
    reclaimPolicy: "Retain"
  # Vector retrieval policy — requires an OC image with RETRIEVAL_* deployment
  # alias support (orchestration-center #179 or later); older images silently
  # ignore these keys and the feature stays off.
  retrieval:
    vector:
      enabled: false
      topK: 5
      minScore: 0
      rerank: false
      llmFinal: true
      strict: false
      indexFile: data/vector_index/psop_vectors.json
    llm:
      thinking: true
  # Set to false to skip orchestration-center deployment
  enabled: true
  # Pinned to 1: file-backed runtime state (the data/ PVC) is not shareable
  # across replicas; scale-out needs shared storage and a storage review first.
  replicas: 1
  image:
    repository: ghcr.io/project-openan/orchestration-center
    tag: v1.0.0
    pullPolicy: IfNotPresent
  port: 5001
  # Registry Center URL (auto-discovered if registry.enabled=true)
  agentRegistryUrl: ""
  # Initial admin password for the portal login (OC seeds the 'admin' user on
  # first boot and refuses to start over HTTP without a credential). Required
  # by the installer (config.env OC_ADMIN_PASSWORD); alternatively reference an
  # existing Secret.
  admin:
    initialPassword: ""
    existingSecret: ""   # key: admin-password
  # TLS certificate configuration (mounted at etc/ssl when https.enabled=true)
  # mode: auto (Helm generates self-signed cert, stored in Secret) / secret (user-provided Secret) / off (no certs mounted)
  tls:
    mode: auto
    existingSecret: ""  # Used when mode=secret. Secret containing server.cer, server_key.pem, trust.cer, cert_pwd
  # Ingress upstream client material for backend certificate verification /
  # mTLS: Secret with tls.crt, tls.key, ca.crt (required when
  # ingress.backendVerifyServer=true or https.verifyClient=true).
  ingressClientSecret: ""
  # OC->RC outbound TLS: verify the registry server certificate and present
  # a client certificate when the registry requires mTLS. Secret with
  # trust.cer (+ client.cer, client_key.pem when https.verifyClient=true).
  clientVerifyServer: false
  registryClientSecret: ""
  # LLM configuration for orchestration-center (embed drives workflow
  # semantic retrieval; rerank is optional for top-N retrieval).
  llm:
    chat:
      model: "your-chat-model"
      url: "https://your-llm-provider.com/v1/chat/completions"
      apiKey: "your-api-key"
      existingSecret: ""
      existingSecretKey: "orchestration-llm-chat-api-key"
    embed:
      model: ""
      url: ""
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "orchestration-llm-embed-api-key"
      keyless: false
    rerank:
      model: ""
      url: ""
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "orchestration-llm-rerank-api-key"
      keyless: false
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # HPA
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # Probes
  livenessProbe:
    tcpSocket:
      port: 5001
    initialDelaySeconds: 40
    periodSeconds: 30
  readinessProbe:
    tcpSocket:
      port: 5001
    initialDelaySeconds: 10
    periodSeconds: 10
  # No unauthenticated health endpoint exists (all routes return 401 without
  # a session); a listening TCP socket is the available liveness signal.
  startupProbe:
    tcpSocket:
      port: 5001
    failureThreshold: 12
    periodSeconds: 10

# =============================================================================
# Frontend Configuration (unified entry: portal or workflow-designer)
# =============================================================================
frontend:
  # Set to false to skip the frontend deployment
  enabled: true
  replicas: 2
  # Which frontend serves the unified entry:
  #   portal            - openan-portal (default; container listens on 8080,
  #                       proxies /api/orchestrate and /api/registry itself)
  #   workflow-designer - legacy frontend (container listens on 80, chart
  #                       manages its nginx config)
  type: portal
  image:
    # Empty repository -> derived from frontend.type
    # (ghcr.io/project-openan/openan-portal or .../workflow-designer)
    repository: ""
    tag: v1.0.0
    pullPolicy: IfNotPresent
  # External Service port (stable); the container port switches by type.
  port: 80
  nodePort: 30191
  # Backend TLS: material for the frontend nginx to verify the backend server
  # certificate and present a client certificate (mTLS) when the backend
  # requires it. Secret keys: trust.cer (required), client.cer + client_key.pem
  # (for mTLS). Leave empty for plain-HTTP backends. The workflow-designer
  # image consumes these via BACKEND_CA_FILE / BACKEND_CLIENT_CERT /
  # BACKEND_CLIENT_KEY (its 15-openan-backend.envsh composes the nginx
  # proxy_ssl_* directives); the portal image gets the same directives via
  # the chart-managed nginx template override.
  backendTlsSecret: ""
  # Nginx configuration for workflow-designer (only used when frontend.type=workflow-designer; mounted as ConfigMap to /etc/nginx/conf.d/default.conf)
  nginxConfig: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy to orchestration-center (nginx gateway)
        location ~ ^/api/orchestrate(/|$)(.*)$ {
            rewrite ^/api/orchestrate(/|$)(.*)$ /$2 break;
            proxy_pass {{ include "openan.httpScheme" . }}://orchestration-center:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            # Verify the backend server cert against the shared CA and present
            # a client certificate when the backend requires one (mTLS).
            proxy_ssl_server_name on;
            proxy_ssl_name orchestration-center;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/backend-tls/trust.cer;
            {{- if .Values.https.verifyClient }}
            proxy_ssl_certificate /etc/nginx/backend-tls/client.cer;
            proxy_ssl_certificate_key /etc/nginx/backend-tls/client_key.pem;
            {{- end }}
            {{- end }}

            # SSE support
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # API proxy to orchestration-center (direct)
        location /rest/v1/orchestrate/ {
            proxy_pass {{ include "openan.httpScheme" . }}://orchestration-center:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            {{- if and .Values.https.enabled .Values.frontend.backendTlsSecret }}
            proxy_ssl_server_name on;
            proxy_ssl_name orchestration-center;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/backend-tls/trust.cer;
            {{- if .Values.https.verifyClient }}
            proxy_ssl_certificate /etc/nginx/backend-tls/client.cer;
            proxy_ssl_certificate_key /etc/nginx/backend-tls/client_key.pem;
            {{- end }}
            {{- end }}
            
            # SSE support
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Static files with cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # HPA
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # Probes
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# =============================================================================
# Ingress Configuration
# =============================================================================
ingress:
  enabled: true
  className: nginx
  # host: Set to a DNS name for host-based routing, or leave empty for IP-based path routing
  # Examples: "openan.local" for DNS, "" for direct IP access (e.g., http://<LB_IP>/)
  host: ""
  # Verify upstream (RC/OC) server certificates on HTTPS backends
  # (proxy-ssl-verify). Requires per-service ingressClientSecret with
  # tls.crt / tls.key / ca.crt when enabled.
  backendVerifyServer: false
  # TLS configuration
  tls:
    enabled: false
    secretName: openan-tls
  # Annotations
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

